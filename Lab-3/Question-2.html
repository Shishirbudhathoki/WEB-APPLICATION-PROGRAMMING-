<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question-2</title>
    <link rel="stylesheet" href="Question-2.css">
</head>

<body>
    <header>
        Create a registration form with the following fields: username, email, role (dropdown: Student or Teacher),
        password, confirm password, full name, email, password, age, gender, course and acceptance of terms and
        conditions.
    </header>
    <main>
        <!-- onSubmit attribute in form tag calls the validateForm() function to validate the form before submission. -->
        <form onsubmit="return validateForm()">

            <!-- for and id is used to associate the label with the input field. id attribute in input should match the for attribute in label. pattern attribute is used for basic validation. required attribute makes the field mandatory. -->
            <label for="fullname">Fullname:</label><br>
            <input type="text" id="fullname" name="fullname" pattern="[A-Za-z\s]+" required
                placeholder="Enter your full name"><br><br>

            <label for="username">Username:</label><br>
            <input type="text" id="username" name="username" pattern="[A-Za-z\s]+" required
                placeholder="Enter user name"><br><br>

            <label for="role">Role:</label><br>
            <select id="role" name="role" required>
                <option value="">Select Role</option>
                <option value="Student">Student</option>
                <option value="Teacher">Teacher</option>
            </select><br><br>

            <label for="email">Email:</label><br>
            <input type="email" id="email" name="email" pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$" required
                placeholder="example@student / tutor.edu.np">
            <span class="error" id="emailError"></span><br><br>

            <label for="password">Password:</label><br>
            <input type="password" id="password" name="password" pattern=".{6,}" required
                placeholder="Enter your password"><br><br>
            <label for="Confirmpass">Confirm Password:</label><br>
            <input type="password" id="Confirmpass" name="Confirmpass" required placeholder="Confirm password">
            <span class="error" id="passError"></span><br><br>

            <label for="age">Age:</label><br>
            <input type="number" id="age" name="age" required placeholder="age">
            <br><br>

            <label>Gender:</label><br>
            <!-- radio buttons are used for selecting one option from multiple choices. -->
            <label><input type="radio" class="radio" name="gender" value="male" required>Male</label>
            <label><input type="radio" class="radio" name="gender" value="female">Female</label>
            <label><input type="radio" class="radio" name="gender" value="other">Other</label><br><br>

            <label for="course">Course:</label><br>
            <select id="course" name="course" required>
                <option value="">Select Course</option>
                <option value="Web App">Web App</option>
                <option value="DSA">DSA</option>
                <option value="Python">Python</option>
                <option value="C++">C++</option>
            </select><br><br>

            <!-- checkbox is used for selecting multiple options. -->
            <input type="checkbox" id="terms" name="terms" required>
            <label for="terms">I accept the terms and conditions</label><br><br>
            <input type="submit" id="submit" value="Submit">
        </form>
    </main>
    <script src="Question-2.js"></script>
</body>

</html>
